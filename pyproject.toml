[project]
name = "radscheduler"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "django<6.0",
    "django-environ",
    "django-model-utils",
    "django-allauth",
    "django-crispy-forms",
    "crispy-bootstrap5",
    "django-redis",
    "django-webpack-loader",
    "django-admin-rangefilter",
    "django-htmx",
    "django-extensions",
    "django-ninja",
    "django-template-partials",
    "dacite",
    "unpoly",
    "pypdf",
    "reportlab",
    "django-ical",
    "python-slugify",
    "Pillow",
    "argon2-cffi",
    "whitenoise",
    "redis",
    "hiredis",
    "holidays",
    "pyyaml",
    "pandas",
]

[project.optional-dependencies]
local = [
    "pip-tools",
    "psycopg[binary]",
    "Werkzeug[watchdog]",
    "ipdb",
    "pytest",
    "pytest-django",
    "pytest-sugar",
    "playwright==1.61",              # Pinning to match nixpkgs version
    "pytest-playwright",
    "freezegun",
    "coverage",
    "sphinx",
    "sphinx-autobuild",
    "ruff",
    "djlint",
    "factory-boy",
    "django-debug-toolbar",
    "django-coverage-plugin",
    "django-webtest",
    "pre-commit",
]
production = ["gunicorn", "psycopg[c]", "sentry-sdk", "django-anymail[mailgun]"]

# ==== pytest ====
[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--ds=config.settings.test --reuse-db"
python_files = ["tests.py", "test_*.py"]

# ==== Coverage ====
[tool.coverage.run]
include = ["radscheduler/**"]
omit = ["*/migrations/*", "*/tests/*"]
plugins = ["django_coverage_plugin"]


# ==== Ruff ====
[tool.ruff]
line-length = 119
target-version = "py313"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
# pycodestyle, Pyflakes, isort, pyupgrade
select = ["E", "W", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["radscheduler", "config"]


# ==== djLint ====
[tool.djlint]
blank_line_after_tag = "load,extends"
close_void_tags = true
format_css = true
format_js = true
# TODO: remove T002 when fixed https://github.com/Riverside-Healthcare/djLint/issues/687
ignore = "H006,H030,H031,T002,H021"
include = "H017,H035"
indent = 2
max_line_length = 119
profile = "django"

[tool.djlint.css]
indent_size = 2

[tool.djlint.js]
indent_size = 2
