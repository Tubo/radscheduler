name: Test and deploy
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: radscheduler
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/radscheduler
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements/local.txt
      - run: pip install -r requirements/local.txt
      - run: playwright install --with-deps chromium
      # The Elm editor's browser tests need the built bundles.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: ruff check .
      - run: ruff format --check .
      # A Playwright trace of each browser test that fails, kept with the run.
      - run: pytest -p no:sugar --tracing retain-on-failure --output test-results
      # TEMPORARY: run the flaky leave requests tests again and again for a trace of the failure.
      - name: Repeat the leave requests tests
        if: always()
        run: |
          failed=0
          for i in $(seq 1 20); do
            pytest -p no:sugar -q radscheduler/functional_tests/test_editor_elm.py \
              radscheduler/functional_tests/test_leave_requests.py \
              --tracing retain-on-failure --output "test-results/repeat-$i" || failed=$((failed + 1))
          done
          echo "$failed of 20 runs failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore

  deploy:
    name: Deploy app
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install flyctl
        run: |
          curl -fsSL https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"
      - name: Run Sentry release
        if: env.SENTRY_AUTH_TOKEN != ''
        run: |
          curl -sL https://sentry.io/get-cli/ | bash
          VERSION=$(sentry-cli releases propose-version)
          sentry-cli releases new "$VERSION" || true
          sentry-cli releases set-commits "$VERSION" --auto || true
          sentry-cli releases finalize "$VERSION" || true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
